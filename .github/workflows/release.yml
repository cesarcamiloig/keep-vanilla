name: Publicar Release

# Se dispara automaticamente cuando empujas un tag que empiece por 'v' (ej: v0.1.0)
# Tambien permite ejecucion manual desde la web si hiciera falta
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el codigo del tag correspondiente
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Go e instalar Packwiz
      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Instalar Packwiz
        run: go install github.com/packwiz/packwiz@latest

      # 3. Exportar el artefacto oficial .mrpack
      - name: Exportar Modpack a .mrpack
        run: |
          packwiz refresh
          packwiz modrinth export
          echo "Artefactos generados:"
          ls -la *.mrpack

      # 4. Crear la GitHub Release y adjuntar el archivo .mrpack
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.mrpack"
          generate_release_notes: true
          name: "Keep Vanilla ${{ github.ref_name }}"
          body: |
            ## Keep Vanilla - Minecraft Vanilla Optimizado + Calidad de Vida (Minecraft 26.2)

            Una experiencia de Minecraft Vanilla optimizada, estable y eficiente, acompañada de mejoras de calidad de vida cuidadosamente seleccionadas para preservar la esencia y jugabilidad original del juego.

            ### Instrucciones de Instalación:
            1. Descarga el archivo `.mrpack` adjunto abajo.
            2. Abre **Prism Launcher**, **Modrinth App**, **PineconeMC** o **ATLauncher**.
            3. Haz clic en **Añadir Instancia -> Importar** y selecciona el archivo `.mrpack`.
            4. ¡Listo para jugar con máximo rendimiento, estabilidad y comodidad!

      # 5. Publicar automáticamente en Modrinth (opcional si existe secreto MODRINTH_TOKEN)
      - name: Publicar en Modrinth
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: keep-vanilla
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: "*.mrpack"
          name: "Keep Vanilla ${{ github.ref_name }}"
          version: "${{ github.ref_name }}"
          version-type: release
          loaders: fabric
          game-versions: "26.2"